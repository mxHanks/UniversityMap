# ==========================================================
#  🍚 蹭饭地图 —— 站点配置文件
#
#  本文件位于项目根目录（config.yml）；
#  打成 jar 部署时，把本文件放到 jar 同目录即可被自动加载。
#  修改配置后需要重启应用才能生效。
# ==========================================================

# ================= 服务运行端口 =================
server:
  port: 8081                    # 应用运行端口（默认 8081）

app:

  # ================= 信息安全核验 =================
  # 开启后，访问网站任何页面都需先输入下方校验码才能进入。
  security:
    enabled: true                # 是否开启访问核验（true=开启 / false=关闭）
    verify-code: ""              # 进入网站的校验码（留空 "" 则视为关闭核验）
                                 # 例如：填写 "abc2026"，访问时需先输入 abc2026 才能进入
    verify-hint: ""              # 校验码提示（可选）：显示在核验页，帮访问者想到校验码
                                 # 例如："班级是什么？" 或 "问班长要班级暗号"
    session-ttl: 604800          # 通过核验后的有效时长（秒），默认 604800 = 7 天

  # ================= 高德地图 =================
  # 在 https://lbs.amap.com/ 控制台 → 应用管理 → 创建「Web端(JS API)」Key
  # ⚠️ 请填入你自己申请的 Key（切勿把真实 Key 提交到公开仓库）
  amap:
    key: ""                      # 高德地图 Web 端 JS API Key

  # ================= 备案信息（页面底部展示，可选） =================
  site:
    icp: ""                      # ICP 备案号（可选），如：京ICP备2024000000号
    net-filing: ""               # 公安网备号（可选），如：京公网安备 11010500000000号
