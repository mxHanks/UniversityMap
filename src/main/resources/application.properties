# ===== 服务器配置 =====
# 运行端口默认 8081；如需改端口，请在根目录 config.yml 的 server.port 中配置（会覆盖此处）
server.port=8081
# 如需通过 /universitymap 访问，取消下面注释
# server.servlet.context-path=/universitymap

# ===== JSON 文件存储路径 =====
app.data.dir=data

# ===== Thymeleaf 配置 =====
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ===== 外部配置文件（config.yml） =====
# 读取项目根目录（或 jar 同目录）的 config.yml，用于配置校验码、高德 Key、备案号等
spring.config.additional-location=optional:file:./config.yml
