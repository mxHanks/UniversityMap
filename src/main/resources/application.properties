# ===== 服务器配置 =====
# 运行端口默认 8081；如需改端口，请在根目录 config.yml 的 server.port 中配置（会覆盖此处）
server.port=8081
# 如需通过 /universitymap 访问，取消下面注释
# server.servlet.context-path=/universitymap

# ===== JSON 文件存储路径 =====
app.data.dir=data

# ===== Thymeleaf 配置 =====
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ===== 外部配置文件（config.yml） =====
# config.yml 的加载在 UniversityMapApplication.main() 中完成，查找顺序：
#   1) jar 包同目录（部署时 config.yml 与 jar 放一起即可，与启动目录无关）
#   2) classes 目录逐级向上（IntelliJ 运行时 = 项目根目录）
#   3) 当前工作目录（兜底）
# 不在这里配置 spring.config.additional-location——application.properties 里的相对路径
# 在部分环境无法解析到工作目录，导致 config.yml 不生效。
